# proof_kernel_policy.yaml — frozen Phase 1 (v0.4 section 5; hardening v0.4.6 F3).
toolchain: "leanprover/lean4:v4.21.0 (elan identity + mathlib commit + lake-manifest hash pinned at Phase-1 execution)"
frozen_modules: [lean/Frozen/SplayDefs.lean, lean/Frozen/MSTC0002Defs.lean, lean/Frozen/Statements.lean]
mutable_modules: [lean/Proofs/Injection.lean, lean/Proofs/Locality.lean, lean/Proofs/Preservation.lean, lean/Proofs/Boundary.lean, lean/Proofs/Constants.lean, lean/Proofs/Repayment.lean, lean/Proofs/Integrability.lean, lean/Proofs/Composition.lean, lean/Proofs/Telescope.lean, lean/Proofs/Family.lean]
axiom_policy:
