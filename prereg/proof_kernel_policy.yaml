  rule: "no custom axiom may assert or imply any theorem-bearing property (v0.4.4 D4); '#print axioms' closure reported at Phase-1 execution; custom-theorem-axiom dependence invalidates Layer B"
sorry_scan: "CI greps lean/ for sorry/admit/axiom/opaque-theorems; any hit fails closed"
three_layer_certificate: [Layer-A-math-proofs, Layer-B-formal-kernel, Layer-C-human-review]
mismatch_rule: FORMALIZATION_MISMATCH-fail-closed
equivalence_rule: "Lean<->Python equivalence PROVED at Phase-03 execution; finite canary agreement is sanity-only and discharges nothing"
markdown_lean_binding: "FORM-12 statement-hash binding in theorem_battlefield.yaml"
