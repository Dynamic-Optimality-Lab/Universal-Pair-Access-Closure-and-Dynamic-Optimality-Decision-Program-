# proof_stress_corpus.yaml — NORMATIVE PSC definition (frozen content draft; hash sealed at FOUNDATION_FROZEN)
# Each of the 7 families below is a complete machine-readable generator specification.
# Later `python/proof_attack/*.py` implementations are placeholders until they pass the
# conformance harness (§conformance); any behavior change without a versioned prereg
# amendment is a STOP-17 violation. REFUTE(MST0-17) negation carries endpoint terms
# (lhs = Splay(Y,T)+E_m-E_0, rhs = 2*Splay(X,T)+A(n)); see PSC-PA objectives.
spec_version: PSC-v0.4-WP5
canonical_rules:
  arithmetic: exact_integer_rational_only
  rng: seeded_deterministic_sorted_outputs_only
  parallelism: post_sorted_canonical_only
  floats_forbidden_for_verdicts: true
  solver_sat_requires_exact_replay: true
  solver_unsat_requires_certificate_or_independent_proof: true
conformance:
  harness: tests/mutation/test_psc_conformance.py
  required_checks:
    - interface_signature_match
    - seeded_determinism_vectors
    - canonical_order_agreement
    - replay_agreement_on_frozen_vectors
  placeholder_guard: NOT_CONFORMED
  violation: STOP-17
families:  # EXACTLY the 7 spec-frozen families (§8.2); no 8th family may be added without amendment
  PSC-L:
    theorem_id: MST0-08U
    legal_input_domain: legal BST pairs (A,B) over [n] with bottom-up Splay traces; single A-side rotation events with provenance/supports/scales
    generators:
      - locality_support_explosion
      - primitive_change_counter
      - provenance_descendant_enumerator
      - scale_touch_maximizer
      - ownership_change_maximizer
      - heap_lazy_depth_prober
      - descriptor_span_maximizer
    parameter_ranges:
      n: [16, 24, 32, 48, 64, 96, 128, 192, 256, 384, 512, 768, 1024]
      seeds: 0..9999
      symbolic_axes: [interval_gap, support_span, rank_gap]
    seed_policy: fixed_seed_list_versioned; no post-hoc reseeding (STOP-17, T101)
    objective_vector_order: [reference_support_radius, changed_primitives_per_A_rotation, provenance_descendants, touched_scales, ownership_changing_boundaries, heap_lazy_depth, descriptor_span]
    symbolic_domains: {interval_endpoints: arbitrary_legal, subtree_sizes: arbitrary_nonnegative, ranks: arbitrary_legal, supports: arbitrary_legal}
    minimization_order: [n_asc, support_radius_asc, episode_hash_lex_asc]
    canonical_ordering: [n_asc, input_hash_lex_asc]
    replay_policy: independent_replay_plus_cleanroom_agreement
    independent_check_policy: cleanroom_locality_check_no_shared_helpers
    allowed_freedom: [sampling_density, sharding_layout]
    forbidden_changes: [negation_predicate, legality_definition, objective_semantics, canonical_order]
  PSC-P:
    theorem_id: MST0-11
    legal_input_domain: legal primitive updates (ROOT, ZIG-left, ZIG-right, LL, RR, LR, RL) x every MSTC-0002 ledger rule, parameterized by arbitrary intervals/sizes/ranks/supports
    generators:
      - symbolic_case_splitter_7xRules
      - concrete_sampler_for_falsification
      - lean_obligation_emitter
      - missing_case_detector
    parameter_ranges:
      n: [16, 24, 32, 48, 64, 96, 128, 192, 256, 384, 512]
      seeds: 0..9999
      symbolic_axes: [interval_endpoints, subtree_sizes, ranks, supports]
    seed_policy: fixed_seed_list_versioned; no post-hoc reseeding (STOP-17, T101)
    objective_vector_order: [preservation_obligation_violations, case_coverage_gaps]
    symbolic_domains: {splay_cases: [ROOT, ZIG-left, ZIG-right, LL, RR, LR, RL], ledger_rules: [T5, T6, T7, support, scale, ownership, provenance, energy]}
    minimization_order: [n_asc, case_index_asc, episode_hash_lex_asc]
    canonical_ordering: [n_asc, input_hash_lex_asc]
    replay_policy: independent_replay_plus_cleanroom_agreement
    independent_check_policy: cleanroom_preservation_check_no_shared_helpers
    allowed_freedom: [sampling_density, sharding_layout]
    forbidden_changes: [case_enumeration, obligation_set_9_items, legality_definition, canonical_order]
  PSC-B:
    theorem_id: MST0-09
    legal_input_domain: legal paired executions with boundary structures (active/nested/alternating/reactivating/mirror)
    generators:
      - boundary_count_maximizer
      - nesting_constructor
      - orientation_alternator
      - creation_destruction_rate_prober
      - rank_gap_extreme_sampler
      - interval_span_maximizer
      - keep_burden_coincidence_constructor
      - delete_burst_prefixer
      - credit_lifetime_prober
      - reactivation_constructor
      - mirror_family_generator
    parameter_ranges:
      n: [16, 24, 32, 48, 64, 96, 128, 192, 256, 384, 512, 768, 1024]
      seeds: 0..9999
      symbolic_axes: [rank_gap, interval_span, burst_length]
    seed_policy: fixed_seed_list_versioned; no post-hoc reseeding (STOP-17, T101)
    objective_vector_order: [active_boundaries, nesting_depth, alternations, creation_destruction_rate, rank_gap, interval_span, simultaneous_keep_burden, delete_burst_before_keep, credit_lifetime, reactivations, mirror_asymmetry]
    symbolic_domains: {boundaries: arbitrary_legal, orientations: [LEFT, RIGHT, MIXED]}
    minimization_order: [n_asc, witness_size_asc, episode_hash_lex_asc]
    canonical_ordering: [n_asc, input_hash_lex_asc]
    replay_policy: independent_replay_plus_cleanroom_agreement_with_inflation_attempt
    independent_check_policy: cleanroom_boundary_check_no_shared_helpers
    allowed_freedom: [sampling_density, sharding_layout]
    forbidden_changes: [damage_definition, source_cost_requirement, legality_definition, canonical_order]
  PSC-K6:
    theorem_id: MST0-14
    legal_input_domain: legal KEEP events/blocks with ledgers under imported MSTC-0002 payment semantics (paid = imported_MSTC0002_payment(...), required = max(w,0), w = y-2a)
    generators:
      - scale_combination_enumerator
      - rotation_role_sampler
      - provenance_class_sampler
      - orientation_mixer
      - nested_interval_constructor
      - zigzig_zigzag_alternator
      - boundary_crossing_constructor
      - delete_burst_then_keep
      - latent_packet_ager
      - simultaneous_activation_constructor
      - mirror_family_generator
      - rank_gap_extreme_sampler
      - recurrent_keep_motif_repeater
    parameter_ranges:
      n: [16, 24, 32, 48, 64, 96, 128, 192, 256, 384, 512, 768, 1024]
      seeds: 0..9999
      symbolic_axes: [scale_combo, provenance_class, rank_gap, burst_length, latent_age]
    seed_policy: fixed_seed_list_versioned; no post-hoc reseeding (STOP-17, T101)
    objective_vector_order: [positive_residual, independent_demand_estimate, simultaneous_activations]
    symbolic_domains: {k_semantics: imported_record_only__no_six_slot_assumption, supports: arbitrary_legal, scales: arbitrary_legal}
    minimization_order: [n_asc, residual_desc__then_size_asc, episode_hash_lex_asc]
    canonical_ordering: [n_asc, input_hash_lex_asc]
    replay_policy: independent_replay_plus_cleanroom_agreement_with_canonical_minimization
    independent_check_policy: cleanroom_repayment_check_no_shared_helpers
    allowed_freedom: [sampling_density, sharding_layout]
    forbidden_changes: [payment_function, required_definition, k_interpretation, legality_definition, canonical_order]
  PSC-I:
    theorem_id: MST0-15
    legal_input_domain: legal paired histories with credit-use graphs (create/own/transfer/split/merge/activate/consume/cancel/migrate)
    generators:
      - reuse_multiplicity_prober
      - ownership_ambiguity_constructor
      - cycle_formation_prober
      - endpoint_defect_prober
      - decomposition_disagreement_harness
      - long_history_torture
      - recurrent_keep_cycle_feeder
      - nested_crossing_interval_constructor
    parameter_ranges:
      n: [16, 24, 32, 48, 64, 96, 128, 192, 256, 384, 512]
      history_lengths: [1, 2, 4, 8, 16, 32, 64, 128, 256]
      seeds: 0..9999
    seed_policy: fixed_seed_list_versioned; no post-hoc reseeding (STOP-17, T101)
    objective_vector_order: [reuse_multiplicity, ownership_ambiguity, cycles, endpoint_defect, decomposition_disagreement]
    symbolic_domains: {intervals: [nested, crossing], decompositions: two_canonical_repartitionings}
    minimization_order: [n_asc, history_length_asc, episode_hash_lex_asc]
    canonical_ordering: [n_asc, input_hash_lex_asc]
    replay_policy: independent_replay_plus_cleanroom_graph_rebuild
    independent_check_policy: cleanroom_integrability_check_no_shared_helpers
    allowed_freedom: [sampling_density, sharding_layout]
    forbidden_changes: [graph_completeness_requirement, conservation_rules, legality_definition, canonical_order]
  PSC-T:
    theorem_id: MST0-18
    legal_input_domain: legal blocked executions with endpoint ledgers (E_0, E_m) and additive term A(n)
    generators:
      - negative_drift_prober
      - normalization_reset_prober
      - sequence_dependent_additive_prober
      - block_overlap_constructor
      - missing_access_detector
      - hidden_midreset_prober
    parameter_ranges:
      n: [16, 24, 32, 48, 64, 96, 128, 192, 256, 384, 512]
      seeds: 0..9999
    seed_policy: fixed_seed_list_versioned; no post-hoc reseeding (STOP-17, T101)
    objective_vector_order: [endpoint_negativity, normalization_slip, additive_sequence_dependence, overlap, omissions, hidden_resets]
    symbolic_domains: {additive_forms: exact_formula_candidates, partitions: exact_once_blockings}
    minimization_order: [n_asc, episode_hash_lex_asc]
    canonical_ordering: [n_asc, input_hash_lex_asc]
    replay_policy: independent_replay_plus_symbolic_telescope_check
    independent_check_policy: second_implementation_endpoint_audit
    allowed_freedom: [sampling_density, sharding_layout]
    forbidden_changes: [endpoint_definitions, additive_compatibility_requirement, direction, canonical_order]
  PSC-N:
    theorem_id: NEGATIVE
    legal_input_domain: closed-form parameterized families (T_m, X_m) with legality proofs (NOT solver-enumerated instances)
    generators:
      - obstruction_seed_mapper
      - closed_form_family_constructor
      - legality_prover_harness
      - prefix_replay_sampler
    parameter_ranges:
      m: [1, 2, 4, 8, 16, 32, 64, 128]
      seeds: 0..9999
    seed_policy: fixed_seed_list_versioned; activation_only_on_preserved_exact_witness
    objective_vector_order: [splay_lower_g, competitor_upper_f, ratio_g_over_f]
    symbolic_domains: {families: closed_form_only, bounds: [symbolic_g, symbolic_f, divergence_proof]}
    minimization_order: [m_asc, episode_hash_lex_asc]
    canonical_ordering: [m_asc, input_hash_lex_asc]
    replay_policy: independent_finite_prefix_replay_confirmatory_only
    independent_check_policy: second_implementation_legality_plus_bounds_audit
    allowed_freedom: [prefix_depths]
    forbidden_changes: [closed_form_requirement, legality_proof_requirement, divergence_proof_requirement]
refutation_interfaces:  # NOT PSC families — per-theorem attack interfaces frozen under Phase-04 (§22); MST0-08U/09/11/14/15/18 reuse PSC-L/B/P/K6/I/T above
  REFUTE-MST0-17:
    legal_input_domain: legal executions (n,T,X,Y<=X with Y<=X certificate, canonical/frozen block decomposition, L_0, terminal L_m, E_0, E_m) evaluated as lhs = Splay(Y,T)+E_m-E_0 vs rhs = 2*Splay(X,T)+A(n)
    generators:
      - triple_tree_sequence_sampler
      - symbolic_subsequence_choice_enumerator
      - spliced_block_aware_constructor
      - mirror_scale_extreme_sampler
      - delete_burst_then_keep_motif_feeder
    parameter_ranges:
      n: [16, 24, 32, 48, 64, 96, 128, 192, 256, 384, 512, 768, 1024]
      seeds: 0..9999
      symbolic_axes: [subsequence_choice, block_decomposition, rank_gap]
    seed_policy: fixed_seed_list_versioned; no post-hoc reseeding (STOP-17, T101)
    objective_vector_order: [lhs_minus_rhs_residual, triple_size]
    symbolic_domains: {subsequence: arbitrary_legal_sublists_with_certificate, blocks: canonical_frozen_decompositions, ledgers: [L_0, L_m]}
    minimization_order: [n_asc, residual_desc__then_size_asc, episode_hash_lex_asc]
    canonical_ordering: [n_asc, input_hash_lex_asc]
    replay_policy: independent_replay_plus_cleanroom_agreement_with_15_field_payload_and_inflation
    independent_check_policy: cleanroom_pair_access_check_no_shared_helpers
    allowed_freedom: [sampling_density, sharding_layout]
    forbidden_changes: [negation_with_endpoint_terms, witness_payload_15_fields, legality_definition, canonical_order]
