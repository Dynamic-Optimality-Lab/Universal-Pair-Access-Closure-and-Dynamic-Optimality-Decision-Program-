# dual_obligation_policy.yaml — simultaneous PROVE/REFUTE + preregistered proof mutants (04.2).
simultaneous_policy: every-critical-node-carries-PROVE-and-REFUTE-tracks
prove_may_use_only: [reviewed-upstream-theorems, frozen-definitions]
refute_targets: exact-negation-only
canonical_counterexample_order: frozen-per-family-in-proof_stress_corpus.yaml
review_package_schema: schemas/review_record.schema.json
erratum_policy: versioned-preserve-old-review-and-defect-then-invalidate-downstream-by-hash
no_downstream_consumption_before_REVIEWED: true
no_status_change_on_green_tests: true
proof_mutants_preregistered:
  - delete-one-splay-case
  - delete-one-ledger-rule-case
  - mutate-one-rule-result
  - alter-one-support-relation
  - weaken-one-quantifier
  - relax-C-or-k
  - drop-one-preservation-obligation
  - drop-endpoint-bound
  - flip-bridge-direction
  - omit-cleanroom-agreement
mutant_policy: suite-must-reject-every-mutant-plus-known-killed-control
MST0-13-reviewer-gates: [MST0_13_REVIEWED, MST0_13_REJECTED, MST0_13_BLOCKED]
reject_is_not_refuted: true
MST0-17-refutation-gate: [proof_attack-record, pair_access-certificate, interface-conformance]
