# negative_lifting_policy.yaml — frozen Phase 1 (v0.4 section 16).
activation: dormant-until-exact-REFUTED
activation_rule: "bare REJECT/BLOCKED without exact legal witness routes to POSITIVE_ROUTE_BLOCKED_UNRESOLVED_NO_CLAIM, never lifting; local residual or Pair-Access counterexample without reduction never lifts (T079-T081, STOP-60)"
DISPROVED_certificate_requirements:
  - closed-form-obstruction-family
  - legality-proofs-T_m-and-X_m
  - splay-lower-bound-g-of-m
  - competitor-upper-bound-f-of-m
  - divergence-proof-g-over-f-to-infinity
  - independent-finite-prefix-replay
  - ledger-independent-formal-proof
